<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Delete dialog</title></head>
<body>
  <div data-test-modal="" role="dialog" tabindex="-1" class="artdeco-modal artdeco-modal--layer-default feed-components-shared-decision-modal " size="small" aria-labelledby="decision-modal-header">
    <span class="a11y-text">Dialog content start.</span>
    <button aria-label="Dismiss" class="artdeco-button artdeco-button--circle artdeco-button--muted artdeco-button--2 artdeco-button--tertiary ember-view artdeco-modal__dismiss" data-test-modal-close-btn="">
      <svg role="none" aria-hidden="true" class="artdeco-button__icon " xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><use href="#close-medium" width="24" height="24"></use></svg>
      <span class="artdeco-button__text"></span>
    </button>
    <div class="artdeco-modal__header pb0 ember-view">
      <h2 id="decision-modal-header" class="t-18 t-black t-bold mt1 ph2">Delete post?</h2>
    </div>
    <div class="artdeco-modal__content ember-view">
      <p class="feed-components-shared-decision-modal__description t-14 t-black--light t-normal">
        Are you sure you want to permanently remove this post from LinkedIn?
      </p>
    </div>
    <div class="artdeco-modal__actionbar ember-view">
      <div class="feed-components-shared-decision-modal__buttons-container display-flex justify-flex-end">
        <button class="artdeco-button artdeco-button--2 artdeco-button--secondary artdeco-button--muted mr1" type="button">Cancel</button>
        <button class="artdeco-button artdeco-button--primary artdeco-button--2" type="button">Delete</button>
      </div>
    </div>
    <span class="a11y-text">Dialog content end.</span>
  </div>
</body>
</html>
