[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "Custom LinkedIn MCP server: post, edit profile, search jobs, Easy Apply"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2.0",
    "patchright>=1.49.0",
]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]